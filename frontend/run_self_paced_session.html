<!DOCTYPE html>

<html>

<head>
    <title id = "webpage_title"></title>
    <link rel="stylesheet" href="shared.css">
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>

<body>

    <style>
        #session_id {
            font-size: 12px;
        }
        #current_problem_id {
            font-size: 12px;
        }
    </style>

    <script src = "student_auth.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const { createClient } = supabase;
        const client = createClient('https://njeksdjjndvqpueniyps.supabase.co', 'sb_publishable_1Xo-DLe_Y5eGdOfTr7nSeg_K8rju5uF');
    </script>

    <div class = "screen">

        <!--session title and id-->

        <div class = "cell">
            <div class = "subcell" id = "sessionTitle"></div>
        </div>

        <!-- Reder Current Problem: html + title -->
        <div class = "cell" id = "current_problem">
            <b><div class = "subcell" id = "current_problem_title" style="margin-bottom: 16px;"></div></b>
            <div class = "subcell" id = "current_problem_data" style="margin-bottom: 16px;"></div>
            <div class = "subcell" id = "current_problem_id" style="color: var(--light_ink);"></div>
        </div>

        <!-- Session Controls: submit answer, current problem number/total problems-->

        <div class = "cell">
            <div class = "subcell" style="font-size: var(--med-font);" id = "problem_counter"></div>
        
            <div class = "subcell" id = "session_controls" style="flex-direction: row;">
                <button class = "subcell nav_button" style = "background: var(--paper);" id = "previous_button" style="margin: 4px;">Previous</button>
                <button class = "subcell nav_button" style = "background: var(--paper);" id = "next_button" style="margin: 4px;">Next</button>
            </div>
        </div>

        <!-- Controls: Next Problem Button -->


        <button class = "cell" id = "answer_button">Press when proved!</button>

    </div>

    <script>

    isLoggedIn();

        async function init() {
        
            // Load some data
                const { data: { user } } = await client.auth.getUser();
                const params = new URLSearchParams(window.location.search);
                const sessionId = params.get('session');
                const { data: session, error: sessionError } = await client.from('sessions').select('*').eq('id', sessionId).single();
                const { data: sessionProblems } = await client.from('session_problems').select('*, problems(*)').eq('session_id', sessionId).order('position');
                let current_problem_number = 0;
                let now = new Date().toISOString();

                // get current attempt number

                let {data : PreviousAttemptNumber} = await client.from('attempts')
                .select('attempt_number')
                .eq('solver_id',user.id)
                .eq('problem_id', sessionProblems[current_problem_number].problems.id)
                .order('attempt_number', {ascending: false})
                .limit(1);

                let HighestAttemptNumber = PreviousAttemptNumber.length ? PreviousAttemptNumber[0].attempt_number : 0; 

                // upload session attempt number to session_attempts table

                session_attempt_id = crypto.randomUUID();
                await client.from('session_attempts').insert({
                    'id': session_attempt_id,
                    'session_id': sessionId,
                    'solver_id': user.id,
                    'attempt_number': parseInt(params.get('attempt'), 10),
                    'started_at': now
                });
            // set webpage title

            const webpage_title = document.getElementById("webpage_title");
            webpage_title.textContent = session.title;

            const sessionTitle = document.getElementById("sessionTitle");
            sessionTitle.textContent = session.title;

            // render problem title

            const problem_counter = document.getElementById("problem_counter");
            const total_num_problems = Math.max(...sessionProblems.map(item => item.position));
            problem_counter.textContent = `Current Problem Number: ${current_problem_number + 1}/${total_num_problems + 1}`;

            const current_problem_title = document.getElementById("current_problem_title");
            current_problem_title.textContent = sessionProblems[current_problem_number].problems.title;
          
            // render statement text

            const current_problem_data = document.getElementById("current_problem_data");
            current_problem_data.innerHTML = sessionProblems[current_problem_number].problems.statement_html;

            // render problem id

            const current_problem_id = document.getElementById("current_problem_id");
            current_problem_id.textContent = `Problem Id: ${sessionProblems[current_problem_number].problems.id}`;

            // answer field

            // proof based answer
                let problemStartedAt = new Date();
                let problemEndedAt = new Date();
                const proof_based_answer_button = document.getElementById("answer_button");
                let isProved = false;
                proof_based_answer_button.addEventListener('click', async function () {
                    proof_based_answer_button.classList.toggle('selected');
                    isProved = !isProved;
                    if (isProved == true) {
                        problemEndedAt = new Date();
                        await client.from('session_states_log').update({closed_at: new Date().toISOString()}).eq('presented_at',now);
                    }
                });


            // sync to database for current problem

                
            // upadate session_states_log for first problem

            await client.from('session_states_log').insert({
                    solver_id:user.id,
                    problem_id:sessionProblems[current_problem_number].problems.id,
                    session_id:sessionId,
                    presented_at: now
                });

            // check for changes in sessions table for current_problem_number
            // update page accordingly
            // upload data accordingly
            
            let current_session_params = client.channel('current_session_params').on(
                'postgres_changes',
                {
                    event: 'UPDATE',
                    schema: 'public',
                    table: 'sessions',
                    filter: `id=eq.${sessionId}`
                },
                async (payload) => {
                    let previousProblemNumber = current_problem_number;
                    current_problem_number = payload.new.current_problem_number;
                    problem_counter.textContent = `Current Problem Number: ${current_problem_number + 1}/${total_num_problems + 1}`;
                    current_problem_title.textContent = sessionProblems[current_problem_number].problems.title;
                    current_problem_data.innerHTML = sessionProblems[current_problem_number].problems.statement_html;
                    current_problem_id.textContent = `Problem Id: ${sessionProblems[current_problem_number].problems.id}`;
                    if (isProved == false) problemEndedAt = new Date();
                    const error = await client.from('attempts').insert({
                        solver_id:user.id,
                        problem_id:sessionProblems[previousProblemNumber].problems.id,
                        session_id:sessionId,
                        attempt_number:HighestAttemptNumber+1, // correct this to a more dynamic number later
                        is_correct:isProved, // ensure that this is correctly maintained
                        time_taken_seconds: Math.round((problemEndedAt - problemStartedAt) / 1000), // time taken in seconds
                        session_attempt_id: session_attempt_id
                    });
                    if (error) console.error(error);
                    now = new Date().toISOString();
                    await client.from('session_states_log').insert({
                        solver_id:user.id,
                        problem_id:sessionProblems[current_problem_number].problems.id,
                        session_id:sessionId,
                        presented_at: now
                    });

                    // Update The Problems Highest Attempt Number

                    let {data : PreviousAttemptNumber} = await client.from('attempts')
                    .select('attempt_number')
                    .eq('solver_id',user.id)
                    .eq('problem_id', sessionProblems[current_problem_number].problems.id)
                    .order('attempt_number', {ascending: false})
                    .limit(1);
                    HighestAttemptNumber = PreviousAttemptNumber.length ? PreviousAttemptNumber[0].attempt_number : 0; 


                    // reset proof values
                    proof_based_answer_button.classList.remove('selected');
                    isProved = false;
                    problemStartedAt = new Date();
                    problemEndedAt = new Date();
                }   
                ).subscribe();
        }

        init();
        
    </script>

</body>

</html>
