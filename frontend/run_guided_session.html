<!DOCTYPE html>

<html>

<head>
    <title id = "webpage_title"></title>
    <link rel="stylesheet" href="shared.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css">
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>

<body>

    <style>
        #session_id {
            font-size: 12px;
        }
        #current_problem_id {
            font-size: 12px;
        }
        .answer_block { display: contents; }
        .answer_block.hidden { display: none; }
    </style>

    <script src = "student_auth.js"></script>
    <script src = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src = "session_common.js"></script>
    <script>
        const { createClient } = supabase;
        const client = createClient('https://njeksdjjndvqpueniyps.supabase.co', 'sb_publishable_1Xo-DLe_Y5eGdOfTr7nSeg_K8rju5uF');
    </script>
    <script defer
        src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.js">
    </script>

    <div class = "screen">

        <!--session title and id-->

        <div class = "cell">
            <div class = "subcell" id = "sessionTitle"></div>
        </div>

        <!-- Reder Current Problem: html + title -->
        <div class = "cell" id = "current_problem">
            <b><div class = "subcell" id = "current_problem_title" style="margin-bottom: 16px;"></div></b>
            <div class = "subcell" id = "current_problem_data" style="margin-bottom: 16px;"></div>
            <div class = "subcell" id = "current_problem_id" style="color: var(--light_ink);"></div>
        </div>

        <!-- Session Controls: submit answer, current problem number/total problems-->

        <div class = "cell">
                <div class = "subcell" id = "problem_counter"></div>
        </div>

        <!-- Proof based answer button -->

        <div id = "proof_block" class = "answer_block">
            <button class = "cell" id = "proof_based_answer_button">Press when proved!</button>
        </div>

        <!-- Integer answer field -->

        <div id = "integer_block" class = "answer_block">
            <input class = "cell" type = "text" id = "integer_answer_input" placeholder="Type answer (integer)">
            <button class = "cell nav_button" id = "integer_submit">Submit Answer</button>
        </div>

        <!-- Mcq answer field-->

        <div id = "mcq_block" class = "answer_block">
            <div id = "mcq_options" class = "answer_block"></div>
            <button class = "cell nav_button" id = "mcq_submit">Submit Answer</button>
        </div>

    </div>

    <script>

    isLoggedIn();

        async function init() {
        
            // Load data, define const elements, define let variables
            let { user, params, session, sessionId, sessionProblems, current_problem_number, now, total_num_problems } = await loadData();
            const {proof_block, mcq_options, mcq_submit, integer_block, integer_submit, proof_based_answer_button, webpage_title, sessionTitle, current_problem_data, problem_counter, current_problem_title, current_problem_id} = define_const_elements();
            let {answer_text, answer_html, solution_id, problemStartedAt, problemEndedAt, isProved, previousProblemNumber} = define_let_variables();

            // Get highest attempt number of the current problem
            let HighestAttemptNumber = await getHighestAttemptNumber(user, sessionProblems, current_problem_number);

            // upload session attempt number to session_attempts table
            const { session_attempt_id, _ } = await upload_attempt_number_to_session_attempts(user, sessionId, params, now);
            
            // set webpage and session title
            webpage_title.textContent = session.title;
            sessionTitle.textContent = session.title;

            // update problem in frontend

            problem_counter.textContent = `Current Problem Number: ${current_problem_number + 1}/${total_num_problems + 1}`;
            current_problem_title.textContent = sessionProblems[current_problem_number].problems.title;
            current_problem_data.innerHTML = sessionProblems[current_problem_number].problems.statement_html;
            current_problem_id.textContent = `Problem Id: ${sessionProblems[current_problem_number].problems.id}`;

            // answer field

            // proof based answer logic

            proof_based_answer_button.addEventListener('click', async function () {
                proof_based_answer_button.classList.toggle('selected');
                isProved = !isProved;
                if (isProved == true) {
                    problemEndedAt = new Date();
                    await client.from('session_states_log').update({closed_at: new Date().toISOString()}).eq('presented_at',now);
                }
            });
            
            // answer display logic

            showAnswerBlock(sessionProblems[current_problem_number].problems.problem_type);

            // refresh answer fields

            ({ isProved, problemStartedAt, problemEndedAt } = await refresh_answer_fields(proof_based_answer_button, isProved, problemStartedAt, problemEndedAt, sessionProblems, current_problem_number, mcq_options, mcq_submit, integer_submit));

            // wiring submit logic

            mcq_submit.addEventListener('click', function () {
                problemEndedAt = new Date();
                submit_mcq_answer(mcq_submit, mcq_options, user, sessionProblems, current_problem_number, sessionId, solution_id, HighestAttemptNumber, problemStartedAt, problemEndedAt, session_attempt_id);
            });
            integer_submit.addEventListener('click', function () {
                problemEndedAt = new Date();
                submit_integer_answer(integer_submit, user, sessionProblems, current_problem_number, sessionId, HighestAttemptNumber, problemStartedAt, problemEndedAt, session_attempt_id);
            });

            // sync to database for current problem

            // upadate session_states_log for first problem

            await client.from('session_states_log').insert({
                    'solver_id':user.id,
                    'problem_id':sessionProblems[current_problem_number].problems.id,
                    'session_id':sessionId,
                    'presented_at': now
                });

            // check for changes in sessions table for current_problem_number
            // update page accordingly
            // upload data accordingly
            
            let current_session_params = client.channel('current_session_params').on(
                'postgres_changes',
                {
                    event: 'UPDATE',
                    schema: 'public',
                    table: 'sessions',
                    filter: `id=eq.${sessionId}`
                },
                async (payload) => {

                    // load the next problem in frontend and update problem number counters
                    ({ previousProblemNumber, current_problem_number } = update_problem_in_frontend(current_problem_number, payload, problem_counter, current_problem_title, current_problem_data, current_problem_id, sessionProblems, total_num_problems, previousProblemNumber));
                    // insert proof based answer, which submits when we go onto the next problem
                    if (sessionProblems[previousProblemNumber].problems.problem_type == 'proof'){
                        submit_proof_answer(isProved, user, sessionProblems, previousProblemNumber, sessionId, HighestAttemptNumber, problemEndedAt, problemStartedAt, session_attempt_id)
                    }
                    // update session states log
                    now = new Date().toISOString();
                    await client.from('session_states_log').insert({
                        'solver_id':user.id,
                        'problem_id':sessionProblems[current_problem_number].problems.id,
                        'session_id':sessionId,
                        'presented_at': now
                    });
                    // Update The Problems Highest Attempt Number
                    HighestAttemptNumber = await getHighestAttemptNumber(user, sessionProblems, current_problem_number);  
                    // reset answer fields
                    ({ isProved, problemStartedAt, problemEndedAt } = await refresh_answer_fields(proof_based_answer_button, isProved, problemStartedAt, problemEndedAt, sessionProblems, current_problem_number, mcq_options, mcq_submit, integer_submit));
                    // reset answer type
                    showAnswerBlock(sessionProblems[current_problem_number].problems.problem_type);
                }   
                ).subscribe();
        }

        init();
        
    </script>

</body>

</html>
