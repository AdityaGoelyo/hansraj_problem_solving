<!DOCTYPE html>

<html>

<head>
    <title>Student Sessions</title>
    <link rel="stylesheet" href="shared.css">
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>

<body>

    <script src = "student_auth.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const { createClient } = supabase;
        const client = createClient('https://njeksdjjndvqpueniyps.supabase.co', 'sb_publishable_1Xo-DLe_Y5eGdOfTr7nSeg_K8rju5uF');
    </script>

    <div id = "the_screen" class = "screen" style = "justify-content: center;">

        <!--Logo and go back to home-->
        <button id = "go-home" class="cell nav_button" style="font-size: 150%;">Home</button>
        <script>
            const home_button = document.getElementById("go-home")
            function goHome() {
                window.location.href = 'student_dashboard.html';
            }
            home_button.addEventListener('click', goHome)
        </script>

        <!--Load the Sessions-->
        <script>
        
        isLoggedIn();
            
            async function init() {

                // Load some data
                const { data: { user } } = await client.auth.getUser();
                const container = document.getElementById('the_screen');

                const { data, error } = await client.from('sessions').select('*');
                for (const session of data) {
                    const cell = document.createElement('button');
                    cell.className = 'cell nav_button';
                    cell.textContent = session.title;
                    cell.addEventListener('click', async function click() {

                        // add session attempt number in the url
                        let { data: AttemptNumberArray, error } = await client.from('session_attempts')
                        .select('*')
                        .eq('session_id',session.id)
                        .eq('solver_id', user.id)
                        .order('attempt_number', { ascending: false })
                        .limit(1);
                        if (error) console.error(error);
                        let HighestAttemptNumber = AttemptNumberArray.length  ? AttemptNumberArray[0].attempt_number + 1 : 1; 
                        if (session.session_type == 'guided') {
                            window.location.href = 'run_guided_session.html?session=' + session.id + '&attempt=' + HighestAttemptNumber;
                        } else if (session.session_type == 'self_paced') {
                            window.location.href = 'run_self_paced_session.html?session=' + session.id + '&attempt=' + HighestAttemptNumber;
                        }
                    });
                    container.appendChild(cell);
                }
            }
            init();

        </script>

    </div>

</body>

</html>
